spring.application.name=qlydancu
server.port=8080
# External, git-ignored settings; system environment can override these values.
spring.config.import=optional:file:./backend-local.properties

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/qlydancu?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.seed.enabled=false

# Uploads
app.upload.root-dir=uploads
app.upload.user-requests-dir=${app.upload.root-dir}/user-requests
app.upload.vehicles-dir=${app.upload.root-dir}/vehicles

# SQL init
spring.sql.init.mode=never
water-meter.start-period=${WATER_METER_START_PERIOD:2026-11}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Apply V20261105_01, V20261105_02, V20261109_01 and V20261109_02 migrations before enabling.
app.billing-reminders.enabled=${BILLING_REMINDERS_ENABLED:true}
app.billing-reminders.scheduler-enabled=${BILLING_REMINDER_SCHEDULER_ENABLED:true}
app.billing-reminders.worker-enabled=${BILLING_EMAIL_WORKER_ENABLED:true}
app.billing-reminders.cron=${BILLING_REMINDER_CRON:0 0 8 * * *}
app.billing-reminders.zone=Asia/Ho_Chi_Minh
app.billing-reminders.max-attempts=5
app.billing-reminders.retry-base-seconds=60
app.billing-reminders.lease-seconds=300
app.billing-reminders.min-send-interval-seconds=10
app.billing-reminders.worker-delay-ms=10000
app.billing-reminders.website-url=${PUBLIC_WEBSITE_URL:${FRONTEND_URL:}}
app.billing-reminders.support-phone=${BILLING_SUPPORT_PHONE:}
app.billing-reminders.system-name=${BILLING_MANAGEMENT_NAME:Qu\u1ea3n l\u00fd chung c\u01b0}
app.billing-reminders.support-email=${BILLING_SUPPORT_EMAIL:}
app.billing-reminders.office-address=${BILLING_OFFICE_ADDRESS:}
app.billing-reminders.simulation=${BILLING_SERVICE_SIMULATION:false}

# SePay configuration is independent of Spring profiles. Live Mode is not implemented.
app.sepay.enabled=${SEPAY_ENABLED:false}
app.sepay.test-mode=${SEPAY_TEST_MODE:true}
app.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
app.sepay.bank=${SEPAY_BANK:}
app.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
app.sepay.account-name=${SEPAY_ACCOUNT_NAME:}
app.sepay.frontend-url=${FRONTEND_URL:http://localhost:5173}
